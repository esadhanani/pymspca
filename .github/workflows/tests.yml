name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[test]"
      - run: pytest -q -rs
        env:
          PYTHONPATH: tests

  # Bit-exact parity with the R package on the same machine: install CRAN msPCA from
  # source on the runner, regenerate the reference outputs, compare with array_equal.
  r-parity:
    name: R parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install CRAN msPCA from source
        run: |
          Rscript -e 'install.packages(c("Rcpp", "RcppEigen"))'
          Rscript -e 'install.packages("msPCA", repos = "https://cloud.r-project.org", type = "source")'
          Rscript -e 'cat("msPCA", as.character(packageVersion("msPCA")), "RcppEigen", as.character(packageVersion("RcppEigen")), "\n")'
      - run: Rscript parity/run_r.R r_out
      - run: pip install ".[test]"
      - name: Compare with R (report)
        run: python parity/compare.py r_out
        env:
          PYTHONPATH: tests
      # macOS arm64: bit-exact. Linux x86-64: the last bits differ (see parity/README.md),
      # so assert identical supports and objectives to 1e-3.
      - name: Assert parity
        run: pytest -q tests/test_parity_r.py
        env:
          PYTHONPATH: tests
          PYMSPCA_R_OUT: r_out
          PYMSPCA_PARITY_EXACT: ${{ runner.os == 'macOS' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-out-${{ matrix.os }}
          path: r_out
